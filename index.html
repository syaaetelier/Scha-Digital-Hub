<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scha Digital Learning Center</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#fbcfe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scha Digital">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3429/3429402.png">

  <!-- Manifest Data URL -->
  <link rel="manifest" id="pwa-manifest">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            pastel: {
              pink: '#ffd1dc',
              magenta: '#f472b6',
              lavender: '#e9d5ff',
              cyan: '#cff4fc',
              peach: '#ffedd5',
              coral: '#fda4af',
              yellow: '#fef08a',
              softPink: '#fce7f3'
            }
          },
          boxShadow: {
            hard: '2px 3px 0px 0px rgba(0,0,0,1)',
            'hard-sm': '1px 2px 0px 0px rgba(0,0,0,1)'
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #1e293b;
    }
    .bg-app-gradient {
      background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #bae6fd 100%);
      background-attachment: fixed;
    }
    .bg-customer-gradient {
      background: linear-gradient(135deg, #93c5fd 0%, #c084fc 50%, #f472b6 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-app-gradient text-slate-900 antialiased min-h-screen flex flex-col justify-between font-sans">

  <!-- APP ROOT CONTAINER -->
  <div id="app" class="w-full max-w-md md:max-w-4xl mx-auto min-h-screen min-h-[100dvh] flex flex-col relative pb-20"></div>

  <!-- PERSISTENT BOTTOM NAVIGATION (ADMIN ONLY) -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-black/10 shadow-lg max-w-md md:max-w-4xl mx-auto rounded-t-2xl">
    <div class="grid grid-cols-6 h-16 text-xs font-semibold text-slate-700">
      <button onclick="navigate('/my-sales')" id="nav-my-sales" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span class="nav-label" data-en="Sales" data-bm="Jualan">Jualan</span>
      </button>
      <button onclick="navigate('/add-catalog')" id="nav-add-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="nav-label" data-en="+ Catalog" data-bm="+ Katalog">+ Katalog</span>
      </button>
      <button onclick="navigate('/manage-catalog')" id="nav-manage-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        <span class="nav-label" data-en="Manage" data-bm="Urus">Urus</span>
      </button>
      <button onclick="openCustomerCatalog()" id="nav-view-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        <span class="nav-label" data-en="Shop" data-bm="Kedai">Kedai</span>
      </button>
      <button onclick="navigate('/sales-record')" id="nav-sales-record" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="nav-label" data-en="Record" data-bm="Rekod">Rekod</span>
      </button>
      <button onclick="navigate('/setting')" id="nav-setting" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="nav-label" data-en="Setting" data-bm="Tetapan">Tetapan</span>
      </button>
    </div>
  </nav>

  <!-- FULLSCREEN IMAGE VIEWER MODAL -->
  <div id="image-viewer-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between items-center p-4">
    <div class="w-full flex justify-between items-center text-white pt-2">
      <span id="image-viewer-counter" class="text-sm font-semibold">1 / 1</span>
      <button onclick="closeImageViewer()" class="p-2 bg-white/20 rounded-full text-white hover:bg-white/40 transition">✕</button>
    </div>
    <div class="relative w-full flex-1 flex items-center justify-center my-auto overflow-hidden">
      <img id="image-viewer-img" src="" alt="Full view" class="max-h-[80vh] max-w-full object-contain rounded-lg">
      <button onclick="prevImage()" class="absolute left-2 p-3 bg-white/20 hover:bg-white/40 rounded-full text-white font-bold">‹</button>
      <button onclick="nextImage()" class="absolute right-2 p-3 bg-white/20 hover:bg-white/40 rounded-full text-white font-bold">›</button>
    </div>
    <div class="viewer-hint pb-4 text-xs text-white/70">Tatal atau guna anak panah untuk lihat gambar</div>
  </div>

  <!-- EDIT PRODUCT MODAL FOR MANAGE CATALOGUE (SAVE BUTTON READY) -->
  <div id="edit-product-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-pastel-peach rounded-3xl p-6 border-2 border-black shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-extrabold text-base text-black">Kemaskini / Edit Produk</h3>
        <button onclick="closeEditModal()" class="text-slate-700 font-bold text-lg px-2">✕</button>
      </div>
      <form id="edit-product-form" onsubmit="handleSaveEditedProduct(event)" class="space-y-3">
        <input type="hidden" id="edit-prod-id">
        <div>
          <label class="block text-xs font-bold mb-1">Nama Produk</label>
          <input type="text" id="edit-prod-name" required class="w-full bg-white px-4 py-2 rounded-xl border border-black text-xs font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">Kategori</label>
          <select id="edit-prod-category" class="w-full bg-white px-4 py-2 rounded-xl border border-black text-xs font-bold"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold mb-1">Harga (RM)</label>
            <input type="number" step="0.01" id="edit-prod-price" required oninput="calculateEditTotal()" class="w-full bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Promo (RM)</label>
            <input type="number" step="0.01" id="edit-prod-promo" value="0.00" oninput="calculateEditTotal()" class="w-full bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">Jumlah Akhir (RM)</label>
          <input type="text" id="edit-prod-total" readonly class="w-full bg-slate-100 px-3 py-2 rounded-xl border border-black text-xs font-extrabold text-black">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">Buy Now URL</label>
          <input type="url" id="edit-prod-buynow" class="w-full bg-white px-4 py-2 rounded-xl border border-black text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">WhatsApp URL</label>
          <input type="url" id="edit-prod-wa" class="w-full bg-white px-4 py-2 rounded-xl border border-black text-xs">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-200 rounded-full text-xs font-bold border border-black">Batal</button>
          <button type="submit" id="btn-save-edit" class="px-6 py-2 bg-pastel-coral rounded-full text-xs font-bold border border-black shadow-hard hover:bg-rose-300">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- APPLICATION LOGIC & STATE MANAGEMENT -->
  <script>
    const DB_KEY = 'SCHA_DIGITAL_HUB_DB';
    const INACTIVITY_TIMEOUT = 2 * 60 * 60 * 1000; // 2 Jam
    let inactivityTimer = null;
    
    function getInitialDB() {
      return {
        session: null,
        language: 'BM',
        adminProfile: {
          email: 'admin@scha.com',
          password: 'password123',
          shopId: 'scha001',
          shopName: 'Scha Digital Learning Center',
          welcomeGreeting: 'Selamat datang ke kedai kami!',
          logoUrl: 'https://cdn-icons-png.flaticon.com/512/3429/3429402.png'
        },
        categories: ['Prasekolah', 'Sekolah Rendah', 'Sekolah Menengah', 'Bundle', 'Apps'],
        sources: ['bcl.my', 'Aeon', 'Pindahan Bank', 'Tunai', 'WhatsApp'],
        products: [],
        sales: []
      };
    }

    function loadDB() {
      const data = localStorage.getItem(DB_KEY);
      if (!data) {
        const initial = getInitialDB();
        localStorage.setItem(DB_KEY, JSON.stringify(initial));
        return initial;
      }
      return JSON.parse(data);
    }

    function saveDB(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    let state = loadDB();

    // Auto Lock 2 Jam Inaktif
    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (state.session && state.session.loggedIn) {
        inactivityTimer = setTimeout(() => {
          state.session = null;
          saveDB(state);
          alert('Sesi anda telah dikunci secara automatik selepas 2 jam tidak aktif.');
          navigate('/login');
        }, INACTIVITY_TIMEOUT);
      }
    }

    ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
      window.addEventListener(evt, resetInactivityTimer, true);
    });

    function getCurrentFormattedDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function switchLanguage(lang) {
      state.language = lang;
      saveDB(state);
      renderCurrentRoute();
    }

    function navigate(path) {
      window.history.pushState({}, '', '#' + path);
      renderCurrentRoute();
    }

    window.addEventListener('popstate', () => {
      renderCurrentRoute();
    });

    function openCustomerCatalog() {
      navigate('/catalog');
    }

    function renderCurrentRoute() {
      resetInactivityTimer();
      const app = document.getElementById('app');
      const bottomNav = document.getElementById('bottom-nav');
      let hash = window.location.hash.replace('#', '') || '/';

      const isAuthenticated = state.session && state.session.loggedIn;

      if (!isAuthenticated && !hash.startsWith('/catalog')) {
        hash = '/login';
      } else if (isAuthenticated && (hash === '/' || hash === '/login')) {
        hash = '/my-sales';
      }

      if (isAuthenticated && !hash.startsWith('/catalog')) {
        bottomNav.classList.remove('hidden');
        updateBottomNavActiveState(hash);
      } else {
        bottomNav.classList.add('hidden');
      }

      if (hash === '/login') {
        app.innerHTML = renderPage1Login();
      } else if (hash === '/my-sales') {
        app.innerHTML = renderPage2MySales();
      } else if (hash === '/add-catalog') {
        app.innerHTML = renderPage3AddCatalogue();
        setupAddCatalogEvents();
      } else if (hash === '/manage-catalog') {
        app.innerHTML = renderPage4ManageCatalogue();
      } else if (hash === '/sales-record') {
        app.innerHTML = renderPage5SalesRecord();
      } else if (hash === '/setting') {
        app.innerHTML = renderPage6Setting();
      } else if (hash.startsWith('/catalog')) {
        app.innerHTML = renderPage7CustomerCatalog();
      } else {
        app.innerHTML = renderPage1Login();
      }
      window.scrollTo(0, 0);
    }

    function updateBottomNavActiveState(hash) {
      const buttons = ['my-sales', 'add-catalog', 'manage-catalog', 'view-catalog', 'sales-record', 'setting'];
      buttons.forEach(btn => {
        const el = document.getElementById(`nav-${btn}`);
        if (el) {
          if (hash.includes(btn)) {
            el.classList.add('text-black', 'font-extrabold');
            el.classList.remove('text-slate-600');
          } else {
            el.classList.remove('text-black', 'font-extrabold');
            el.classList.add('text-slate-600');
          }
        }
      });
    }

    // --- PAGE 1: LOGIN ---
    function renderPage1Login() {
      const lang = state.language;
      return `
        <div class="flex-1 flex flex-col justify-center items-center px-4 py-8">
          <div class="w-[88%] bg-pastel-peach/90 rounded-3xl p-6 shadow-xl border border-white/50 text-center flex flex-col items-center">
            <h1 class="text-2xl font-extrabold text-slate-900 mb-6">${lang === 'BM' ? 'Portal Admin' : 'Admin Portal'}</h1>
            <form onsubmit="handleLogin(event)" class="w-full space-y-4">
              <input type="email" id="login-email" required value="${state.adminProfile.email}" class="w-full px-4 py-3 bg-white rounded-2xl border border-black shadow-hard text-sm">
              <input type="password" id="login-password" required value="${state.adminProfile.password}" class="w-full px-4 py-3 bg-white rounded-2xl border border-black shadow-hard text-sm">
              <div id="login-error" class="text-xs text-red-600 font-bold hidden"></div>
              <button type="submit" id="login-btn" class="w-full py-3 bg-white rounded-2xl border border-black shadow-hard text-base font-extrabold text-black hover:bg-slate-50">
                ${lang === 'BM' ? 'Log Masuk' : 'Log In'}
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      if (email === state.adminProfile.email && password === state.adminProfile.password) {
        state.session = { loggedIn: true, email: email };
        saveDB(state);
        navigate('/my-sales');
      } else {
        const err = document.getElementById('login-error');
        err.innerText = state.language === 'BM' ? 'Email atau kata laluan salah.' : 'Invalid credentials.';
        err.classList.remove('hidden');
      }
    }

    // --- PAGE 2: MY SALES ---
    function renderPage2MySales() {
      const lang = state.language;
      const todayDate = getCurrentFormattedDate();
      let totalRevenue = 0;
      state.sales.forEach(s => { totalRevenue += Number(s.amount); });

      return `
        <div class="p-4 space-y-4">
          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm flex justify-between items-start">
            <div>
              <h1 class="text-2xl font-extrabold text-black">${lang === 'BM' ? 'Jualan Saya' : 'My Sales'}</h1>
              <p class="text-xs text-slate-700 mt-1 font-bold">${todayDate}</p>
            </div>
            <button onclick="switchLanguage('${lang === 'BM' ? 'EN' : 'BM'}')" class="bg-pastel-pink px-3 py-1 rounded-full text-xs font-bold border border-black">${lang}</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-pastel-peach p-4 rounded-3xl border border-black/10">
              <span class="text-xs text-slate-700 font-semibold">Jumlah Hasil</span>
              <div class="text-xl font-extrabold text-black mt-2">RM ${totalRevenue.toFixed(2)}</div>
            </div>
          </div>
        </div>
      `;
    }

    // --- PAGE 3: ADD CATALOGUE (SAVE BUTTON READY) ---
    let tempAddProductMedia = [];

    function renderPage3AddCatalogue() {
      const lang = state.language;
      const autoOrderNo = `QS` + String(state.products.length + 1).padStart(3, '0');

      return `
        <div class="p-4 space-y-4">
          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-black">${lang === 'BM' ? 'Tambah Katalog' : 'Add Catalogue'}</h1>
            <button onclick="navigate('/my-sales')" class="bg-pastel-coral px-3 py-1 rounded-full text-xs font-bold border border-black">← Kembali</button>
          </div>

          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm space-y-4">
            <form onsubmit="handleSaveProduct(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold mb-1">Nama Produk</label>
                <input type="text" id="prod-name" required class="w-full bg-white px-4 py-2 rounded-full border border-black text-xs">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">No Pesanan</label>
                  <input type="text" id="prod-order" value="${autoOrderNo}" readonly class="w-full bg-slate-100 px-4 py-2 rounded-full border border-black text-xs font-bold">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Kategori</label>
                  <select id="prod-category" required class="w-full bg-white px-4 py-2 rounded-full border border-black text-xs font-bold">
                    ${state.categories.map(c => `<option value="${c}">${c}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">Harga (RM)</label>
                  <input type="number" step="0.01" id="prod-price" required oninput="calculateTotalPrice()" class="w-full bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Promo (RM)</label>
                  <input type="number" step="0.01" id="prod-promo" value="0.00" oninput="calculateTotalPrice()" class="w-full bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
                </div>
                <div>
                  <label class="block text-xs font-bold mb-1">Jumlah</label>
                  <input type="text" id="prod-total" readonly value="0.00" class="w-full bg-slate-100 px-3 py-2 rounded-xl border border-black text-xs font-extrabold">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Gambar (Maks 6)</label>
                <input type="file" id="media-picker" accept="image/*" multiple class="hidden" onchange="handleNativeImageUpload(event)">
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mt-2" id="image-slots-container"></div>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Buy Now URL</label>
                <input type="url" id="prod-buynow" placeholder="https://..." class="w-full bg-white px-4 py-2 rounded-full border border-black text-xs">
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">WhatsApp URL</label>
                <input type="url" id="prod-wa" placeholder="https://wa.me/..." class="w-full bg-white px-4 py-2 rounded-full border border-black text-xs">
              </div>
              <div class="flex justify-end pt-3">
                <button type="submit" id="save-prod-btn" class="bg-pastel-coral px-8 py-3 rounded-full font-bold text-sm border border-black shadow-hard hover:bg-rose-300">
                  Simpan Katalog
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function setupAddCatalogEvents() {
      tempAddProductMedia = [];
      renderImageSlots();
    }

    function renderImageSlots() {
      const container = document.getElementById('image-slots-container');
      if (!container) return;
      let html = '';
      for (let i = 0; i < 6; i++) {
        if (tempAddProductMedia[i]) {
          html += `<div class="relative w-full h-16 bg-white rounded-xl border border-black overflow-hidden"><img src="${tempAddProductMedia[i]}" class="w-full h-full object-cover"><button type="button" onclick="removeTempImage(${i})" class="absolute top-0 right-0 bg-red-600 text-white px-1 text-[10px]">✕</button></div>`;
        } else {
          html += `<div onclick="document.getElementById('media-picker').click()" class="w-full h-16 bg-pastel-coral/30 rounded-xl border-2 border-dashed border-black/30 flex items-center justify-center cursor-pointer text-xs font-bold">+ Slot ${i+1}</div>`;
        }
      }
      container.innerHTML = html;
    }

    function handleNativeImageUpload(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          if (tempAddProductMedia.length < 6) {
            tempAddProductMedia.push(evt.target.result);
            renderImageSlots();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function removeTempImage(idx) {
      tempAddProductMedia.splice(idx, 1);
      renderImageSlots();
    }

    function calculateTotalPrice() {
      const p = parseFloat(document.getElementById('prod-price').value) || 0;
      const pr = parseFloat(document.getElementById('prod-promo').value) || 0;
      document.getElementById('prod-total').value = Math.max(0, p - pr).toFixed(2);
    }

    function handleSaveProduct(e) {
      e.preventDefault();
      const name = document.getElementById('prod-name').value.trim();
      const orderNo = document.getElementById('prod-order').value;
      const category = document.getElementById('prod-category').value;
      const price = parseFloat(document.getElementById('prod-price').value) || 0;
      const promo = parseFloat(document.getElementById('prod-promo').value) || 0;
      const totalPrice = parseFloat(document.getElementById('prod-total').value) || 0;
      const buyNowUrl = document.getElementById('prod-buynow').value.trim();
      const whatsappUrl = document.getElementById('prod-wa').value.trim();

      const newProd = {
        id: 'PROD_' + Date.now(),
        orderNo,
        name,
        category,
        price,
        promo,
        totalPrice,
        images: tempAddProductMedia.length > 0 ? tempAddProductMedia : ['https://cdn-icons-png.flaticon.com/512/3429/3429402.png'],
        buyNowUrl,
        whatsappUrl,
        status: 'ACTIVE'
      };

      state.products.push(newProd);
      saveDB(state);
      alert('Produk berjaya disimpan!');
      navigate('/manage-catalog');
    }

    // --- PAGE 4: MANAGE CATALOGUE (EDIT & SAVE MODAL) ---
    function renderPage4ManageCatalogue() {
      const lang = state.language;
      return `
        <div class="p-4 space-y-4">
          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-black">${lang === 'BM' ? 'Urus Katalog' : 'Manage Catalogue'}</h1>
            <button onclick="navigate('/add-catalog')" class="bg-pastel-coral px-3 py-1 rounded-full text-xs font-bold border border-black">+ Tambah</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${state.products.length === 0 ? `<div class="col-span-2 text-center text-xs text-slate-500 py-6">Tiada produk.</div>` : ''}
            ${state.products.map(p => `
              <div class="bg-white p-3 rounded-2xl border border-black/10 shadow-sm flex flex-col justify-between">
                <div>
                  <img src="${p.images[0]}" class="w-full h-28 object-cover rounded-xl border">
                  <div class="text-[10px] font-bold text-slate-500 mt-1">${p.category} (${p.orderNo})</div>
                  <div class="font-bold text-xs text-black line-clamp-1">${p.name}</div>
                  <div class="font-extrabold text-sm text-black mt-1">RM ${p.totalPrice.toFixed(2)}</div>
                </div>
                <div class="flex justify-between items-center pt-3 text-xs font-bold">
                  <button onclick="openEditModal('${p.id}')" class="text-blue-700 bg-pastel-yellow px-3 py-1 rounded-full border border-black shadow-hard-sm">Edit</button>
                  <button onclick="deleteProduct('${p.id}')" class="text-red-600 bg-pastel-coral px-3 py-1 rounded-full border border-black shadow-hard-sm">Padam</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function deleteProduct(prodId) {
      if (confirm('Padam produk ini?')) {
        state.products = state.products.filter(p => p.id !== prodId);
        saveDB(state);
        renderCurrentRoute();
      }
    }

    function openEditModal(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (!prod) return;

      document.getElementById('edit-prod-id').value = prod.id;
      document.getElementById('edit-prod-name').value = prod.name;
      document.getElementById('edit-prod-price').value = prod.price;
      document.getElementById('edit-prod-promo').value = prod.promo || 0;
      document.getElementById('edit-prod-total').value = prod.totalPrice.toFixed(2);
      document.getElementById('edit-prod-buynow').value = prod.buyNowUrl || '';
      document.getElementById('edit-prod-wa').value = prod.whatsappUrl || '';

      const catSelect = document.getElementById('edit-prod-category');
      catSelect.innerHTML = state.categories.map(c => `<option value="${c}" ${c === prod.category ? 'selected' : ''}>${c}</option>`).join('');

      document.getElementById('edit-product-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-product-modal').classList.add('hidden');
    }

    function calculateEditTotal() {
      const p = parseFloat(document.getElementById('edit-prod-price').value) || 0;
      const pr = parseFloat(document.getElementById('edit-prod-promo').value) || 0;
      document.getElementById('edit-prod-total').value = Math.max(0, p - pr).toFixed(2);
    }

    function handleSaveEditedProduct(e) {
      e.preventDefault();
      const id = document.getElementById('edit-prod-id').value;
      const prod = state.products.find(p => p.id === id);
      if (prod) {
        prod.name = document.getElementById('edit-prod-name').value.trim();
        prod.category = document.getElementById('edit-prod-category').value;
        prod.price = parseFloat(document.getElementById('edit-prod-price').value) || 0;
        prod.promo = parseFloat(document.getElementById('edit-prod-promo').value) || 0;
        prod.totalPrice = parseFloat(document.getElementById('edit-prod-total').value) || 0;
        prod.buyNowUrl = document.getElementById('edit-prod-buynow').value.trim();
        prod.whatsappUrl = document.getElementById('edit-prod-wa').value.trim();

        saveDB(state);
        closeEditModal();
        alert('Perubahan produk berjaya disimpan!');
        renderCurrentRoute();
      }
    }

    // --- PAGE 5: SALES RECORD (SAVE BUTTON READY) ---
    function renderPage5SalesRecord() {
      const lang = state.language;
      const todayDate = getCurrentFormattedDate();

      return `
        <div class="p-4 space-y-4">
          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-black">${lang === 'BM' ? 'Rekod Jualan' : 'Sales Record'}</h1>
          </div>

          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm space-y-4">
            <div class="space-y-1.5 max-h-48 overflow-y-auto">
              ${state.sales.length === 0 ? `<div class="text-center text-xs text-slate-500 py-3">Tiada rekod jualan.</div>` : ''}
              ${state.sales.map(s => `
                <div class="bg-white rounded-xl p-2.5 text-xs font-semibold grid grid-cols-4 text-center items-center border border-black/10">
                  <div>${s.date}</div>
                  <div class="font-bold">${s.orderNo}</div>
                  <div class="font-bold">RM ${Number(s.amount).toFixed(2)}</div>
                  <div><button onclick="removeSaleRecord('${s.id}')" class="text-red-600 font-bold">✕</button></div>
                </div>
              `).join('')}
            </div>

            <hr class="border-black/10">

            <h3 class="font-bold text-xs text-black">Tambah Jualan Manual</h3>
            <form onsubmit="handleSaveManualSale(event)" class="space-y-3">
              <div class="grid grid-cols-2 gap-2">
                <input type="text" id="manual-date" value="${todayDate}" required class="bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
                <select id="manual-order" required class="bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
                  ${state.products.length === 0 ? `<option value="QS000">Tiada Produk</option>` : ''}
                  ${state.products.map(p => `<option value="${p.orderNo}">${p.orderNo} -${p.name.substring(0,10)}</option>`).join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <select id="manual-source" required class="bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
                  ${state.sources.map(src => `<option value="${src}">${src}</option>`).join('')}
                </select>
                <input type="number" step="0.01" id="manual-amount" required placeholder="0.00" class="bg-white px-3 py-2 rounded-xl border border-black text-xs font-bold">
              </div>
              <div class="flex justify-end">
                <button type="submit" class="bg-pastel-coral px-8 py-2.5 rounded-full font-bold text-xs border border-black shadow-hard hover:bg-rose-300">
                  Simpan Rekod Jualan
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function removeSaleRecord(id) {
      state.sales = state.sales.filter(s => s.id !== id);
      saveDB(state);
      renderCurrentRoute();
    }

    function handleSaveManualSale(e) {
      e.preventDefault();
      const date = document.getElementById('manual-date').value;
      const orderNo = document.getElementById('manual-order').value;
      const source = document.getElementById('manual-source').value;
      const amount = parseFloat(document.getElementById('manual-amount').value) || 0;

      const newSale = { id: 'SALE_' + Date.now(), date, orderNo, amount, source };
      state.sales.unshift(newSale);
      saveDB(state);
      alert('Rekod jualan berjaya disimpan!');
      renderCurrentRoute();
    }

    // --- PAGE 6: SETTING ---
    function renderPage6Setting() {
      return `
        <div class="p-4 space-y-4">
          <div class="bg-pastel-peach rounded-3xl p-5 border border-black/10 shadow-sm flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-black">Tetapan</h1>
            <button onclick="handleSignOut()" class="bg-red-500 text-white px-4 py-2 rounded-full text-xs font-bold border border-black">Daftar Keluar</button>
          </div>
        </div>
      `;
    }

    function handleSignOut() {
      state.session = null;
      saveDB(state);
      navigate('/login');
    }

    // --- PAGE 7: CUSTOMER CATALOGUE ---
    function renderPage7CustomerCatalog() {
      return `
        <div class="bg-customer-gradient min-h-screen p-4 space-y-4">
          <div class="bg-pastel-peach/95 rounded-3xl p-6 border text-center shadow-lg">
            <h1 class="font-extrabold text-2xl text-black">${state.adminProfile.shopName}</h1>
            <p class="text-sm font-bold mt-2">${state.adminProfile.welcomeGreeting}</p>
            <button onclick="navigate('/my-sales')" class="mt-4 bg-white px-4 py-1.5 rounded-full text-xs font-bold border border-black">Kembali ke Admin</button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${state.products.map(p => `
              <div class="bg-pastel-peach p-3 rounded-2xl border border-white/60 shadow-md">
                <img src="${p.images[0]}" class="w-full h-28 object-cover rounded-xl">
                <h3 class="font-bold text-xs mt-2">${p.name}</h3>
                <div class="text-red-600 font-extrabold text-xs mt-1">RM ${p.totalPrice.toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Modal Image Viewer
    let currentViewerImages = [];
    let currentViewerIdx = 0;
    function openImageViewer(arr) {
      currentViewerImages = arr;
      currentViewerIdx = 0;
      document.getElementById('image-viewer-img').src = currentViewerImages[0];
      document.getElementById('image-viewer-modal').classList.remove('hidden');
    }
    function closeImageViewer() { document.getElementById('image-viewer-modal').classList.add('hidden'); }
    function nextImage() {
      currentViewerIdx = (currentViewerIdx + 1) % currentViewerImages.length;
      document.getElementById('image-viewer-img').src = currentViewerImages[currentViewerIdx];
    }
    function prevImage() {
      currentViewerIdx = (currentViewerIdx - 1 + currentViewerImages.length) % currentViewerImages.length;
      document.getElementById('image-viewer-img').src = currentViewerImages[currentViewerIdx];
    }

    window.addEventListener('DOMContentLoaded', () => { renderCurrentRoute(); });
  </script>
</body>
</html>
