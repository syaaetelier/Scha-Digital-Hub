<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scha Digital Learning Center</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#fbcfe8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Scha Digital">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3429/3429402.png">

  <!-- Manifest Data URL -->
  <link rel="manifest" id="pwa-manifest">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            pastel: {
              pink: '#ffd1dc',
              magenta: '#f472b6',
              lavender: '#e9d5ff',
              cyan: '#cff4fc',
              peach: '#ffedd5',
              coral: '#fda4af',
              yellow: '#fef08a',
              softPink: '#fce7f3'
            }
          },
          boxShadow: {
            hard: '2px 3px 0px 0px rgba(0,0,0,1)',
            'hard-lg': '4px 5px 0px 0px rgba(0,0,0,1)',
            'hard-sm': '1px 2px 0px 0px rgba(0,0,0,1)'
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      color: #1e293b;
    }
    .bg-app-gradient {
      background: linear-gradient(135deg, #fbcfe8 0%, #e9d5ff 50%, #bae6fd 100%);
      background-attachment: fixed;
    }
    .bg-customer-gradient {
      background: linear-gradient(135deg, #93c5fd 0%, #c084fc 50%, #f472b6 100%);
      background-attachment: fixed;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-app-gradient text-slate-900 antialiased min-h-screen flex flex-col justify-between font-sans">

  <!-- APP ROOT CONTAINER -->
  <div id="app" class="w-full max-w-md md:max-w-4xl mx-auto min-h-screen min-h-[100dvh] flex flex-col relative pb-24">
    <!-- Dynamic Views Rendered Here -->
  </div>

  <!-- PERSISTENT BOTTOM NAVIGATION (ADMIN ONLY) -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-black/10 shadow-lg max-w-md md:max-w-4xl mx-auto rounded-t-2xl">
    <div class="grid grid-cols-6 h-16 text-xs font-semibold text-slate-700">
      <button onclick="navigate('/my-sales')" id="nav-my-sales" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
        <span class="nav-label" data-en="Sales" data-bm="Jualan">Jualan</span>
      </button>
      <button onclick="navigate('/add-catalog')" id="nav-add-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="nav-label" data-en="+ Catalog" data-bm="+ Katalog">+ Katalog</span>
      </button>
      <button onclick="navigate('/manage-catalog')" id="nav-manage-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
        <span class="nav-label" data-en="Manage" data-bm="Urus">Urus</span>
      </button>
      <button onclick="openCustomerCatalog()" id="nav-view-catalog" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        <span class="nav-label" data-en="Shop" data-bm="Kedai">Kedai</span>
      </button>
      <button onclick="navigate('/sales-record')" id="nav-sales-record" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="nav-label" data-en="Record" data-bm="Rekod">Rekod</span>
      </button>
      <button onclick="navigate('/setting')" id="nav-setting" class="flex flex-col items-center justify-center space-y-1 hover:text-black">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="nav-label" data-en="Setting" data-bm="Tetapan">Tetapan</span>
      </button>
    </div>
  </nav>

  <!-- FULLSCREEN IMAGE VIEWER MODAL OVERLAY -->
  <div id="image-viewer-modal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-between items-center p-4">
    <div class="w-full flex justify-between items-center text-white pt-2">
      <span id="image-viewer-counter" class="text-sm font-semibold tracking-wider">1 / 1</span>
      <button onclick="closeImageViewer()" class="p-2 bg-white/20 rounded-full text-white hover:bg-white/40 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="relative w-full flex-1 flex items-center justify-center my-auto overflow-hidden">
      <img id="image-viewer-img" src="" alt="Full view" class="max-h-[80vh] max-w-full object-contain rounded-lg transition-transform duration-300">
      <button onclick="prevImage()" class="absolute left-2 p-3 bg-white/80 hover:bg-white text-black font-extrabold rounded-full shadow-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      <button onclick="nextImage()" class="absolute right-2 p-3 bg-white/80 hover:bg-white text-black font-extrabold rounded-full shadow-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
    <div class="viewer-hint pb-4 text-xs text-white/90 font-bold">Tatal atau guna anak panah untuk lihat gambar</div>
  </div>

  <!-- APPLICATION LOGIC & STATE MANAGEMENT -->
  <script>
    const DB_KEY = 'SCHA_DIGITAL_HUB_DB';
    const INACTIVITY_TIMEOUT = 2 * 60 * 60 * 1000; // 2 Jam
    let inactivityTimer = null;
    
    // Simpanan memori indeks gambar semasa untuk setiap kad produk
    window.cardImageIndices = {};
    window.publicShowArrows = {}; // Status kemunculan arrow untuk Public Customer Catalog selepas klik imej

    // Fungsi Pengurusan Touch Swipe untuk Slider Kad Produk
    let touchStartX = 0;
    let touchEndX = 0;

    function handleTouchStart(e) {
      touchStartX = e.changedTouches[0].screenX;
    }

    function handleTouchEnd(e, prodId, maxLen) {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 40) {
        // Swipe Kiri (Next Image)
        if (!window.cardImageIndices[prodId]) window.cardImageIndices[prodId] = 0;
        window.cardImageIndices[prodId] = (window.cardImageIndices[prodId] + 1) % maxLen;
        updateCardImageDisplay(prodId);
      }
      if (touchEndX > touchStartX + 40) {
        // Swipe Kanan (Prev Image)
        if (!window.cardImageIndices[prodId]) window.cardImageIndices[prodId] = 0;
        window.cardImageIndices[prodId] = (window.cardImageIndices[prodId] - 1 + maxLen) % maxLen;
        updateCardImageDisplay(prodId);
      }
    }
    
    function getInitialDB() {
      return {
        session: null,
        language: 'BM',
        adminProfile: {
          email: 'admin@scha.com',
          password: 'password123',
          shopId: 'scha001',
          shopName: 'Scha Digital Learning Center',
          welcomeGreeting: 'Selamat datang ke kedai kami!',
          logoUrl: 'https://cdn-icons-png.flaticon.com/512/3429/3429402.png'
        },
        categories: ['Prasekolah', 'Sekolah Rendah', 'Sekolah Menengah', 'Bundle', 'Apps'],
        sources: ['bcl.my', 'Aeon', 'Pindahan Bank', 'Tunai', 'WhatsApp'],
        products: [],
        sales: []
      };
    }

    function loadDB() {
      const data = localStorage.getItem(DB_KEY);
      if (!data) {
        const oldData = localStorage.getItem('SCHA_DIGITAL_DB_V4') || localStorage.getItem('SCHA_DIGITAL_DB_V3');
        if (oldData) {
          const parsedOld = JSON.parse(oldData);
          localStorage.setItem(DB_KEY, JSON.stringify(parsedOld));
          return parsedOld;
        }
        const initial = getInitialDB();
        localStorage.setItem(DB_KEY, JSON.stringify(initial));
        return initial;
      }
      return JSON.parse(data);
    }

    function saveDB(db) {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
    }

    let state = loadDB();

    function resetInactivityTimer() {
      clearTimeout(inactivityTimer);
      if (state.session && state.session.loggedIn) {
        inactivityTimer = setTimeout(() => {
          state.session = null;
          saveDB(state);
          const alertMsg = state.language === 'BM' 
            ? 'Sesi anda telah dikunci secara automatik selepas 2 jam tidak aktif. Sila log masuk semula.' 
            : 'Your session has been automatically locked after 2 hours of inactivity. Please log in again.';
          alert(alertMsg);
          navigate('/login');
        }, INACTIVITY_TIMEOUT);
      }
    }

    ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
      window.addEventListener(evt, resetInactivityTimer, true);
    });

    // PWA Manifest Setup
    (function setupPWA() {
      const manifestObj = {
        name: "Scha Digital Learning Center",
        short_name: "Scha Digital",
        start_url: "./",
        display: "standalone",
        background_color: "#ffd1dc",
        theme_color: "#fbcfe8",
        icons: [{
          src: "https://cdn-icons-png.flaticon.com/512/3429/3429402.png",
          sizes: "512x512",
          type: "image/png"
        }]
      };
      const blob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
    })();

    function getCurrentFormattedDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function switchLanguage(lang) {
      state.language = lang;
      saveDB(state);
      renderCurrentRoute();
    }

    function navigate(path) {
      window.history.pushState({}, '', '#' + path);
      renderCurrentRoute();
    }

    window.addEventListener('popstate', () => {
      renderCurrentRoute();
    });

    function openCustomerCatalog() {
      navigate('/catalog');
    }

    function renderCurrentRoute() {
      resetInactivityTimer();
      const app = document.getElementById('app');
      const bottomNav = document.getElementById('bottom-nav');
      let hash = window.location.hash.replace('#', '') || '/';

      const isAuthenticated = state.session && state.session.loggedIn;

      if (!isAuthenticated && !hash.startsWith('/catalog') && hash !== '/register' && hash !== '/forgot-password') {
        hash = '/login';
      } else if (isAuthenticated && (hash === '/' || hash === '/login')) {
        hash = '/my-sales';
      }

      if (isAuthenticated && !hash.startsWith('/catalog')) {
        bottomNav.classList.remove('hidden');
        updateBottomNavActiveState(hash);
      } else {
        bottomNav.classList.add('hidden');
      }

      if (hash === '/login') {
        app.innerHTML = renderPage1Login();
      } else if (hash === '/forgot-password') {
        app.innerHTML = renderForgotPasswordModal();
      } else if (hash === '/register') {
        app.innerHTML = renderRegisterPage();
      } else if (hash === '/my-sales') {
        app.innerHTML = renderPage2MySales();
      } else if (hash === '/add-catalog') {
        app.innerHTML = renderPage3AddCatalogue();
        setupAddCatalogEvents();
      } else if (hash === '/manage-catalog') {
        app.innerHTML = renderPage4ManageCatalogue();
      } else if (hash === '/sales-record') {
        app.innerHTML = renderPage5SalesRecord();
      } else if (hash === '/setting') {
        app.innerHTML = renderPage6Setting();
      } else if (hash.startsWith('/catalog')) {
        const parts = hash.split('/');
        const productId = parts[3] === 'product' ? parts[4] : null; 
        if (productId) {
          app.innerHTML = renderSingleProductPage(productId);
        } else {
          app.innerHTML = renderPage7CustomerCatalog();
        }
      } else {
        app.innerHTML = renderPage1Login();
      }
      
      window.scrollTo(0, 0);
    }

    function updateBottomNavActiveState(hash) {
      const buttons = ['my-sales', 'add-catalog', 'manage-catalog', 'view-catalog', 'sales-record', 'setting'];
      buttons.forEach(btn => {
        const el = document.getElementById(`nav-${btn}`);
        if (el) {
          if (hash.includes(btn)) {
            el.classList.add('text-black', 'font-extrabold');
            el.classList.remove('text-slate-600');
          } else {
            el.classList.remove('text-black', 'font-extrabold');
            el.classList.add('text-slate-600');
          }
        }
      });
      document.querySelectorAll('.nav-label').forEach(el => {
        el.innerText = el.getAttribute(`data-${state.language.toLowerCase()}`);
      });
    }

    // --- FUNGSI SLIDE IMEG PADA KAD PRODUK (MANAGE & CATALOGUE) ---
    function nextCardImage(event, prodId, maxLen) {
      event.stopPropagation();
      if (!window.cardImageIndices[prodId]) window.cardImageIndices[prodId] = 0;
      window.cardImageIndices[prodId] = (window.cardImageIndices[prodId] + 1) % maxLen;
      updateCardImageDisplay(prodId);
    }

    function prevCardImage(event, prodId, maxLen) {
      event.stopPropagation();
      if (!window.cardImageIndices[prodId]) window.cardImageIndices[prodId] = 0;
      window.cardImageIndices[prodId] = (window.cardImageIndices[prodId] - 1 + maxLen) % maxLen;
      updateCardImageDisplay(prodId);
    }

    function updateCardImageDisplay(prodId) {
      const imgEl = document.getElementById(`card-img-${prodId}`);
      const counterEl = document.getElementById(`card-counter-${prodId}`);
      const prod = state.products.find(p => p.id === prodId);
      if (prod && imgEl) {
        const idx = window.cardImageIndices[prodId] || 0;
        imgEl.src = prod.images[idx] || 'https://via.placeholder.com/150';
        if (counterEl) {
          counterEl.innerText = `${idx + 1} / ${prod.images.length}`;
        }
      }
    }

    // Fungsi interaksi klik imej Public Customer: Paparkan arrow navigasi kad apabila diklik
    function handlePublicImageClick(event, prodId, maxLen, imagesArr) {
      event.stopPropagation();
      window.publicShowArrows[prodId] = true;
      const arrowContainer = document.getElementById(`public-arrows-${prodId}`);
      if (arrowContainer) {
        arrowContainer.classList.remove('hidden');
      }
      // Buka juga modal gambar penuh
      openImageViewer(imagesArr);
    }

    // --- PAGE 1: ADMIN LOGIN ---
    function renderPage1Login() {
      const lang = state.language;
      return `
        <div class="flex-1 flex flex-col justify-center items-center px-4 py-8">
          <div class="w-full flex justify-end mb-4">
            <div class="bg-white border-2 border-black rounded-full px-3 py-1 shadow-hard-sm flex space-x-2 text-xs font-bold">
              <button onclick="switchLanguage('EN')" class="${lang === 'EN' ? 'text-pink-600 underline font-extrabold' : 'text-black'}">EN</button>
              <span>|</span>
              <button onclick="switchLanguage('BM')" class="${lang === 'BM' ? 'text-pink-600 underline font-extrabold' : 'text-black'}">BM</button>
            </div>
          </div>

          <div class="w-[88%] bg-pastel-peach/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border border-white/50 text-center flex flex-col items-center">
            <div class="w-28 h-28 bg-white rounded-2xl border-2 border-black/10 shadow-md flex items-center justify-center p-2 mb-4 overflow-hidden">
              <img id="admin-logo-img" src="${state.adminProfile.logoUrl}" alt="Logo" class="w-full h-full object-contain rounded-xl">
            </div>

            <h1 class="text-2xl font-extrabold text-slate-900 mb-6">${lang === 'BM' ? 'Portal Admin' : 'Admin Portal'}</h1>

            <form onsubmit="handleLogin(event)" class="w-full space-y-4">
              <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </span>
                <input type="email" id="login-email" required placeholder="Email" value="${state.adminProfile.email}" class="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-black shadow-hard text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-pink-300">
              </div>

              <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </span>
                <input type="password" id="login-password" required placeholder="${lang === 'BM' ? 'Kata Laluan' : 'Password'}" value="${state.adminProfile.password}" class="w-full pl-10 pr-10 py-3 bg-white rounded-2xl border border-black shadow-hard text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-pink-300">
                <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </button>
              </div>

              <div id="login-error" class="text-xs text-red-600 font-bold hidden"></div>

              <div class="py-1">
                <button type="button" onclick="navigate('/forgot-password')" class="text-xs font-semibold text-slate-800 hover:underline">
                  ${lang === 'BM' ? 'Lupa kata laluan?' : 'Forgot password?'}
                </button>
              </div>

              <button type="submit" id="login-btn" class="w-full py-3 bg-white rounded-2xl border border-black shadow-hard text-base font-extrabold text-black hover:bg-slate-50 active:translate-y-0.5 transition">
                ${lang === 'BM' ? 'Log Masuk' : 'Log In'}
              </button>
            </form>
          </div>

          <div class="mt-6 text-center space-y-1">
            <p class="text-xs text-slate-700 font-medium">${lang === 'BM' ? 'Belum ada akaun?' : "Don't have account?"}</p>
            <button onclick="navigate('/register')" class="text-xs font-extrabold text-black underline">
              ${lang === 'BM' ? 'Daftar di sini' : 'Register here'}
            </button>
          </div>
        </div>
      `;
    }

    function togglePasswordVisibility(id) {
      const input = document.getElementById(id);
      if (input) {

    function setupAddCatalogEvents() {
      tempAddProductMedia = [];
      renderImageSlots();
    }

    function renderImageSlots() {
      const container = document.getElementById('image-slots-container');
      if (!container) return;
      let html = '';
      for (let i = 0; i < 6; i++) {
        if (tempAddProductMedia[i]) {
          html += `
            <div class="relative w-full h-20 bg-white rounded-xl border border-black overflow-hidden group">
              <img src="${tempAddProductMedia[i]}" class="w-full h-full object-cover">
              <button type="button" onclick="removeTempImage(${i})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full p-1 text-[10px] shadow">✕</button>
            </div>
          `;
        } else {
          html += `
            <div onclick="document.getElementById('media-picker').click()" class="w-full h-20 bg-pastel-coral/30 rounded-xl border-2 border-dashed border-black/20 flex flex-col items-center justify-center cursor-pointer hover:bg-pastel-coral/50">
              <span class="text-xl text-slate-500">+</span>
              <span class="text-[9px] text-slate-600">Slot ${i+1}</span>
            </div>
          `;
        }
      }
      container.innerHTML = html;
    }

    function handleNativeImageUpload(e) {
      const files = Array.from(e.target.files);
      if (tempAddProductMedia.length + files.length > 6) {
        alert(state.language === 'BM' ? 'Maksimum 6 gambar sahaja.' : 'Maximum 6 images allowed.');
        return;
      }
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempAddProductMedia.push(evt.target.result);
          renderImageSlots();
        };
        reader.readAsDataURL(file);
      });
    }

    function removeTempImage(idx) {
      tempAddProductMedia.splice(idx, 1);
      renderImageSlots();
    }

    function handleVideoUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const labelText = state.language === 'BM' ? 'Video Dipilih: ' : 'Video Selected: ';
        document.getElementById('video-slot-label').innerText = labelText + file.name.substring(0, 15) + '...';
      }
    }

    function calculateTotalPrice() {
      const p = parseFloat(document.getElementById('prod-price').value) || 0;
      const pr = parseFloat(document.getElementById('prod-promo').value) || 0;
      const tot = Math.max(0, p - pr);
      document.getElementById('prod-total').value = tot.toFixed(2);
    }

    function handleAddCategory() {
      const input = document.getElementById('new-cat-input');
      const val = input.value.trim();
      if (val && !state.categories.includes(val)) {
        state.categories.push(val);
        saveDB(state);
        const sel = document.getElementById('prod-category');
        if (sel) {
          const opt = document.createElement('option');
          opt.value = val;
          opt.innerText = val;
          sel.appendChild(opt);
          sel.value = val;
        }
        input.value = '';
        alert(state.language === 'BM' ? 'Kategori baru berjaya ditambah & disimpan!' : 'New category successfully added & saved!');
      } else {
        alert(state.language === 'BM' ? 'Sila masukkan nama kategori yang sah atau kategori sudah wujud.' : 'Please enter a valid or existing category name.');
      }
    }

    function handleSaveProduct(e) {
      e.preventDefault();
      const name = document.getElementById('prod-name').value.trim();
      const orderNo = document.getElementById('prod-order').value;
      const category = document.getElementById('prod-category').value;
      const price = parseFloat(document.getElementById('prod-price').value) || 0;
      const promo = parseFloat(document.getElementById('prod-promo').value) || 0;
      const totalPrice = parseFloat(document.getElementById('prod-total').value) || 0;
      const buyNowUrl = document.getElementById('prod-buynow').value.trim();
      const whatsappUrl = document.getElementById('prod-wa').value.trim();

      const newProd = {
        id: 'PROD_' + Date.now(),
        orderNo,
        name,
        category,
        price,
        promo,
        totalPrice,
        images: tempAddProductMedia.length > 0 ? tempAddProductMedia : ['https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=500&auto=format&fit=crop'],
        video: '',
        buyNowUrl,
        whatsappUrl,
        status: 'ACTIVE',
        createdDate: new Date().toISOString()
      };

      state.products.push(newProd);
      saveDB(state);
      alert(state.language === 'BM' ? 'Produk berjaya disimpan dengan sempurna!' : 'Product saved successfully and perfectly!');
      navigate('/manage-catalog');
    }

    function handleManageCatFilter(val) {
      filterCategoryValue = val;

    function deleteProduct(prodId) {
      if (confirm(state.language === 'BM' ? 'Adakah anda pasti mahu memadam produk ini?' : 'Are you sure you want to delete this product?')) {
        state.products = state.products.filter(p => p.id !== prodId);
        saveDB(state);
        renderCurrentRoute();
      }
    }

    function editProduct(prodId) {
      const prod = state.products.find(p => p.id === prodId);
      if (prod) {
        const newName = prompt(state.language === 'BM' ? 'Kemaskini Nama Produk:' : 'Update Product Name:', prod.name);
        if (newName) {
          prod.name = newName.trim();
          saveDB(state);
          alert(state.language === 'BM' ? 'Perubahan berjaya disimpan!' : 'Changes saved successfully!');
          renderCurrentRoute();
        }
      }
    }

    // --- FULLSCREEN IMAGE VIEWER MODAL LOGIC ---
    let currentViewerImages = [];
    let currentViewerIdx = 0;

    function openImageViewer(imagesArr) {
      currentViewerImages = imagesArr && imagesArr.length > 0 ? imagesArr : ['https://via.placeholder.com/300'];
      currentViewerIdx = 0;
      updateImageViewerContent();
      document.getElementById('image-viewer-modal').classList.remove('hidden');
    }

    function closeImageViewer() {
      document.getElementById('image-viewer-modal').classList.add('hidden');
    }

    function updateImageViewerContent() {
      const imgEl = document.getElementById('image-viewer-img');
      const counterEl = document.getElementById('image-viewer-counter');
      imgEl.src = currentViewerImages[currentViewerIdx];
      counterEl.innerText = `${currentViewerIdx + 1} / ${currentViewerImages.length}`;
      const hintEl = document.querySelector('.viewer-hint');
      if (hintEl) {
        hintEl.innerText = state.language === 'BM' ? 'Tatal atau guna anak panah untuk lihat gambar dengan jelas' : 'Swipe or use arrows to view images clearly';
      }
    }

    function nextImage() {
      currentViewerIdx = (currentViewerIdx + 1) % currentViewerImages.length;
      updateImageViewerContent();
    }

    function prevImage() {
      currentViewerIdx = (currentViewerIdx - 1 + currentViewerImages.length) % currentViewerImages.length;
      updateImageViewerContent();
    }

    function editSaleRecord(saleId) {
      const sale = state.sales.find(s => s.id === saleId);
      if (sale) {
        const newAmt = prompt(state.language === 'BM' ? 'Kemaskini Jumlah Jualan (RM):' : 'Update Sales Amount (RM):', sale.amount);
        if (newAmt !== null) {
          sale.amount = parseFloat(newAmt) || 0;
          saveDB(state);
          alert(state.language === 'BM' ? 'Rekod jualan berjaya dikemaskini!' : 'Sales record updated successfully!');
          renderCurrentRoute();
        }
      }
    }

    function removeSaleRecord(saleId) {
      if (confirm(state.language === 'BM' ? 'Adakah anda pasti mahu memadam rekod jualan ini?' : 'Are you sure you want to remove this sale record?')) {
        state.sales = state.sales.filter(s => s.id !== saleId);
        saveDB(state);
        renderCurrentRoute();
      }
    }

    function handleAddSource() {
      const input = document.getElementById('new-source-input');
      const val = input.value.trim();
      if (val && !state.sources.includes(val)) {
        state.sources.push(val);
        saveDB(state);
        input.value = '';
        alert(state.language === 'BM' ? 'Sumber baru berjaya disimpan!' : 'New source saved successfully!');
        renderCurrentRoute();
      } else {
        alert(state.language === 'BM' ? 'Sila masukkan sumber yang sah.' : 'Please enter a valid source.');
      }
    }

    function handleSaveManualSale(e) {
      e.preventDefault();
      const date = document.getElementById('manual-date').value;
      const orderNo = document.getElementById('manual-order').value;
      const source = document.getElementById('manual-source').value;
      const amount = parseFloat(document.getElementById('manual-amount').value) || 0;

      const newSale = {
        id: 'SALE_' + Date.now(),
        date,
        orderNo,
        amount,
        source,
        createdDate: new Date().toISOString()
      };

      state.sales.unshift(newSale);
      saveDB(state);
      alert(state.language === 'BM' ? 'Rekod jualan manual berjaya disimpan dengan sempurna!' : 'Manual sale successfully recorded and saved!');
      renderCurrentRoute();
    }

          <!-- Shop Header -->
          <div class="bg-pastel-peach/95 rounded-3xl p-6 border border-white/50 shadow-lg text-center relative overflow-hidden">
            <span class="absolute top-2 left-3 text-lg opacity-80">✈️</span>
            <span class="absolute top-2 right-3 text-lg opacity-80">💌</span>
            <span class="absolute bottom-2 left-4 text-xs opacity-80">💖</span>
            <span class="absolute bottom-2 right-4 text-xs opacity-80">🎀</span>

            <!-- Language Switcher in Public Catalog -->
            <div class="absolute top-3 right-3 z-10 bg-white/80 border border-black rounded-full px-3 py-0.5 text-[10px] font-bold shadow-sm">
              <button onclick="switchLanguage('EN')" class="${lang === 'EN' ? 'text-black font-extrabold underline' : 'text-slate-500'}">EN</button> |
              <button onclick="switchLanguage('BM')" class="${lang === 'BM' ? 'text-black font-extrabold underline' : 'text-slate-500'}">BM</button>
            </div>

            <h1 class="font-extrabold text-2xl text-black leading-tight tracking-wide mt-3">
              ${shopName}
            </h1>
            
            <div class="mt-3 flex items-center justify-center space-x-1">
              <span class="text-xs">🎀</span>
              <p class="font-bold text-sm text-black italic">${greeting}</p>
              <span class="text-xs">🎀</span>
            </div>
          </div>

          <!-- 2 DROPDOWN FILTERS -->
          <div class="bg-pastel-peach/95 rounded-3xl p-4 border border-white/50 shadow-md space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1 text-slate-800">${lang === 'BM' ? 'Penapis Kategori' : 'Filter by Categories'}</label>
              <select onchange="handlePublicCatFilter(this.value)" class="w-full bg-pastel-pink/80 px-4 py-2 rounded-full border-none text-xs font-bold text-black">
                <option value="ALL">${lang === 'BM' ? '-- Semua Kategori --' : '-- All Categories --'}</option>
                ${state.categories.map(c => `<option value="${c}" ${publicCategoryFilter === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-bold mb-1 text-slate-800">${lang === 'BM' ? 'Penapis Produk' : 'Filter by Products'}</label>
              <select onchange="handlePublicProdFilter(this.value)" class="w-full bg-pastel-pink/80 px-4 py-2 rounded-full border-none text-xs font-bold text-black">
                <option value="ALL">${lang === 'BM' ? '-- Semua Produk --' : '-- All Products --'}</option>
                ${state.products.map(p => `<option value="${p.id}" ${publicProductNameFilter === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- Product Grid -->
          <div class="grid grid-cols-2 gap-3">
            ${activeProducts.length === 0 ? `<div class="col-span-2 text-center text-xs text-white py-8 font-semibold">${lang === 'BM' ? 'Tiada produk tersedia buat masa ini.' : 'No products available at the moment.'}</div>` : ''}
            ${activeProducts.map(p => {
              const currentIdx = window.cardImageIndices[p.id] || 0;
              const activeImg = p.images[currentIdx] || p.images[0] || 'https://via.placeholder.com/150';
              const showArrows = window.publicShowArrows[p.id] || false;
              return `
                <div class="bg-pastel-peach p-3 rounded-2xl border border-white/60 shadow-md flex flex-col justify-between relative">
                  <div>
                    <!-- IMAGE SLIDER CONTAINER: ARROWS HIDDEN BY DEFAULT, APPEAR AFTER CLICKING IMAGE -->
                    <div class="w-full h-28 bg-pastel-pink/40 rounded-xl overflow-hidden relative group"
                         ontouchstart="handleTouchStart(event)" 
                         ontouchend="handleTouchEnd(event, '${p.id}',${p.images.length})">
                      <img id="card-img-${p.id}" src="${activeImg}" onclick="handlePublicImageClick(event, '${p.id}', ${p.images.length},${JSON.stringify(p.images).replace(/"/g, '&quot;')})" class="w-full h-full object-cover cursor-pointer">
                      
                      <!-- Navigation Arrows (Hidden by default, shown via state after user clicks image) -->
                      ${p.images && p.images.length > 1 ? `
                        <div id="public-arrows-${p.id}" class="${showArrows ? '' : 'hidden'}">
                          <button type="button" onclick="prevCardImage(event, '${p.id}', ${p.images.length})" class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/90 text-white hover:bg-black p-1.5 rounded-full shadow-md z-10 font-extrabold text-xs">
                            ❮
                          </button>
                          <button type="button" onclick="nextCardImage(event, '${p.id}', ${p.images.length})" class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/90 text-white hover:bg-black p-1.5 rounded-full shadow-md z-10 font-extrabold text-xs">
                            ❯
                          </button>
                        </div>
                        <span id="card-counter-${p.id}" class="absolute bottom-1 right-1 bg-black/80 text-white font-bold text-[9px] px-1.5 py-0.5 rounded-full">
                          ${currentIdx + 1} / ${p.images.length}
                        </span>
                      ` : ''}
                    </div>

                    <div class="flex justify-between items-start mt-2">
                      <div class="text-[9px] font-extrabold text-black uppercase tracking-wider">
                        ${p.category} (${p.orderNo})
                      </div>
                      <button onclick="shareProductLink('${p.id}', '${p.name}')" title="${lang === 'BM' ? 'Kongsi Produk Ini' : 'Share Product'}" class="text-slate-800 hover:text-pink-600 p-0.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                      </button>
                    </div>

                    <h3 class="font-bold text-xs text-black line-clamp-2 mt-0.5">${p.name}</h3>

                    <div class="mt-2 inline-block bg-pastel-yellow px-2.5 py-1 rounded-lg border border-black/10">
                      <span class="font-bold text-xs text-red-600">RM ${p.totalPrice.toFixed(2)}</span>
                    </div>
                  </div>

                  <div class="space-y-1.5 mt-3">
                    <button onclick="handleCustomerBuyNow('${p.buyNowUrl}', '${p.orderNo}',${p.totalPrice})" class="w-full py-1.5 bg-pastel-softPink rounded-full text-[10px] font-extrabold text-black border border-black/10 shadow-sm active:scale-95 transition">
                      ${lang === 'BM' ? 'Beli Sekarang' : 'Buy Now'}
                    </button>
                    <a href="${p.whatsappUrl || '#'}" target="_blank" class="block w-full py-1.5 bg-pastel-softPink text-center rounded-full text-[10px] font-extrabold text-black border border-black/10 shadow-sm">
                      ${lang === 'BM' ? 'Hubungi WhatsApp' : 'Whatsapp Seller'}
                    </a>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handlePublicCatFilter(val) {
      publicCategoryFilter = val;
      renderCurrentRoute();
    }

    function handlePublicProdFilter(val) {
      publicProductNameFilter = val;
      renderCurrentRoute();
    }

    function handleCustomerBuyNow(buyUrl, orderNo, amount) {
      if (buyUrl && buyUrl !== '#') {
        window.open(buyUrl, '_blank');
      } else {
        alert(state.language === 'BM' ? 'Membawa ke payment gateway BCL.my...' : 'Redirecting to BCL.my payment gateway...');
      }

      setTimeout(() => {
        const autoSale = {
          id: 'SALE_' + Date.now(),
          date: getCurrentFormattedDate(),
          orderNo: orderNo,
          amount: amount,
          source: 'bcl.my',
          createdDate: new Date().toISOString()
        };
        state.sales.unshift(autoSale);
        saveDB(state);
      }, 1000);
    }

    function shareProductLink(prodId, prodName) {
      const prodUrl = window.location.origin + window.location.pathname + `#/catalog/product/${prodId}`;
      if (navigator.share) {
        navigator.share({
          title: prodName,
          text: (state.language === 'BM' ? `Lihat produk ${prodName} di ` : `Check out ${prodName} at `) + state.adminProfile.shopName,
          url: prodUrl
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(prodUrl).then(() => {
          alert(state.language === 'BM' ? 'Pautan khas produk berjaya disalin!' : 'Product link copied successfully!');
        });
      }
    }

    function renderSingleProductPage(productId) {
      const lang = state.language;
      const product = state.products.find(p => p.id === productId);
      if (!product) {
        return `<div class="p-8 text-center text-xs font-bold text-white">${lang === 'BM' ? 'Produk tidak ditemui.' : 'Product not found.'}</div>`;
      }
      return `
        <div class="bg-customer-gradient min-h-screen p-4 flex flex-col justify-center items-center">
          <div class="w-full max-w-sm bg-pastel-peach rounded-3xl p-5 border border-white/60 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold uppercase">${product.category}</span>
              <button onclick="openCustomerCatalog()" class="text-xs font-bold underline">${lang === 'BM' ? 'Lihat Semua Katalog' : 'View All Catalogue'}</button>
            </div>
            <div class="w-full h-48 bg-white rounded-2xl overflow-hidden border border-black/10">
              <img src="${product.images[0] || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
            </div>
            <h2 class="font-bold text-base text-black">${product.name}</h2>
            <div class="font-bold text-lg text-red-600">RM ${product.totalPrice.toFixed(2)}</div>
            <div class="space-y-2 pt-2">
              <button onclick="handleCustomerBuyNow('${product.buyNowUrl}', '${product.orderNo}', ${product.totalPrice})" class="w-full py-2.5 bg-pastel-yellow font-bold text-xs rounded-full border border-black/20 shadow-hard-sm">${lang === 'BM' ? 'BELI SEKARANG' : 'BUY NOW'}</button>
              <a href="${product.whatsappUrl || '#'}" target="_blank" class="block w-full py-2.5 bg-pastel-yellow text-center font-bold text-xs rounded-full border border-black/20 shadow-hard-sm">${lang === 'BM' ? 'HUBUNGI WHATSAPP' : 'WHATSAPP SELLER'}</a>
            </div>
          </div>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentRoute();
    });
  </script>
</body>
</html>
